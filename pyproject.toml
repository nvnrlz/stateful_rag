[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stateful-rag"
version = "0.5.0"
description = "Measured, auditable, fail-open caching for multi-turn RAG on PostgreSQL + pgvector."
requires-python = ">=3.10"
authors = [
  {name = "Naveen Kamalakannan"},
  {name = "Ankita Jogekar"},
  {name = "Umaima Haider"}
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.0",
    "psycopg[binary]>=3.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
# Framework integrations are imported lazily; install only what you use.
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
frameworks = ["langchain-core>=0.1.0", "llama-index-core>=0.10.0"]
demo = [
    "sentence-transformers>=2.2.2",
    "streamlit>=1.30.0"
]
# ENT AI-receptionist backend (chat API + ingestion). Offline-capable.
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pymupdf>=1.23"
]
# Real embeddings/LLMs for the actual test (optional, opt-in via env).
app-local = ["sentence-transformers>=2.2.2"]
app-openai = ["openai>=1.0"]
app-anthropic = ["anthropic>=0.25"]
test = [
    "pytest>=7.0.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pymupdf>=1.23"
]

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
