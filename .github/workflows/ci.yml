name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_state
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_state"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STATEFUL_RAG_EMBED_DIM: "8"
      STATEFUL_RAG_LOG_LEVEL: "CRITICAL"
      STATEFUL_RAG_TEST_DATABASE_URL: "postgresql+psycopg://rag_user:rag_password@localhost:5433/rag_state"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests (unit + Postgres integration)
        run: pytest
